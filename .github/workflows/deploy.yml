name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to S3 + CloudFront
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No build step: the existing HTML references unminified assets at
      # `./assets/css/*.css` and `./assets/js/*.js`, so syncing source files
      # directly is what the live site needs. If the HTML is later rewritten
      # to consume `dist/*.min.*`, add `setup-node` + `npm run build` here
      # and sync from `./dist`.

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync long-cache assets (images, favicon)
        run: |
          aws s3 sync . s3://${{ secrets.S3_BUCKET }} \
            --exclude "*" \
            --include "assets/img/*" \
            --include "assets/img/**/*" \
            --include "favicon.svg" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync hot files (HTML, CSS, JS, SW, sitemap, llms, robots)
        run: |
          aws s3 sync . s3://${{ secrets.S3_BUCKET }} \
            --exclude "*" \
            --include "*.html" \
            --include "assets/css/*" \
            --include "assets/js/*" \
            --include "sw.js" \
            --include "robots.txt" \
            --include "sitemap.xml" \
            --include "llms.txt" \
            --include "llms-full.txt" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Reconcile bucket (delete stale objects)
        run: |
          aws s3 sync . s3://${{ secrets.S3_BUCKET }} \
            --delete \
            --size-only \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "infra/*" \
            --exclude "node_modules/*" \
            --exclude "package*.json" \
            --exclude ".claude/*" \
            --exclude "dist/*" \
            --exclude "README.md"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }} \
            --paths "/*"
